<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Predict</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="min-h-screen text-white bg-gradient-to-br from-gray-900 via-gray-800 to-slate-900">
  <nav class="bg-gray-900/95 backdrop-blur border-b border-gray-700">
    <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
      <h1 class="text-xl font-semibold text-white flex items-center gap-2">
        <svg class="w-8 h-8" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <rect width="24" height="24" rx="6" fill="#2563eb"/>
          <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" font-size="11" font-weight="700" fill="white" font-family="Arial,Helvetica,sans-serif">MM</text>
        </svg>
        <span>Predict</span>
      </h1>
      <div class="space-x-4 text-sm">
        <a href="index.html" class="text-gray-300 hover:text-blue-400">Home</a>
        <a href="predict.html" class="text-gray-300 hover:text-blue-400">Predict</a>
        <a href="charts.html" class="text-gray-300 hover:text-blue-400">Charts</a>
      </div>
    </div>
  </nav>
  <main class="max-w-2xl mx-auto p-6">
    <div class="bg-gray-900 p-4 rounded-xl border border-gray-700">
      <div class="grid grid-cols-2 gap-3">
        <input id="study_hours" type="number" step="0.1" min="0" max="16" required placeholder="Study hours (0-16)" class="border rounded px-2 py-2 bg-gray-800 border-gray-700 text-gray-200 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
        <input id="attendance" type="number" step="0.1" min="0" max="100" required placeholder="Attendance % (0-100)" class="border rounded px-2 py-2 bg-gray-800 border-gray-700 text-gray-200 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
        <input id="previous_marks" type="number" step="0.1" min="0" max="100" required placeholder="Previous marks % (0-100)" class="border rounded px-2 py-2 bg-gray-800 border-gray-700 text-gray-200 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-400"/>
      </div>
      <div id="msg" class="mt-2 text-sm text-red-400"></div>
      <button id="predictBtn" class="mt-3 px-4 py-2 rounded-md bg-blue-600 hover:bg-blue-700 text-white shadow-md hover:shadow-lg transition-all">Predict</button>
      <pre id="out" class="mt-3 text-sm text-gray-300"></pre>
    </div>
  </main>
  <footer class="mt-12 py-6 bg-gray-900/80 backdrop-blur border-t border-gray-700">
    <div class="max-w-5xl mx-auto px-4 text-center text-sm text-gray-400">
      <p>&copy; 2025 MarkMate. Built with ♥️ for student success.</p>
    </div>
  </footer>
  <script>
    const API = "/api";
    const token = localStorage.getItem('token') || '';
    const hrsEl = document.getElementById('study_hours');
    const attEl = document.getElementById('attendance');
    const prevEl = document.getElementById('previous_marks');
    const msgEl = document.getElementById('msg');
    const clearErr = (el)=>{ el.classList.remove('ring-2','ring-red-500'); el.removeAttribute('aria-invalid'); };
    const markErr = (el)=>{ el.classList.add('ring-2','ring-red-500'); el.setAttribute('aria-invalid','true'); };

    document.getElementById('predictBtn').onclick = async () => {
      if(!token){ msgEl.innerText = 'Please login first from Home.'; return; }
      clearErr(hrsEl); clearErr(attEl); clearErr(prevEl); msgEl.innerText = '';
      const h = parseFloat(hrsEl.value);
      const a = parseFloat(attEl.value);
      const m = parseFloat(prevEl.value);
      let ok = true;
      if(isNaN(h) || h < 0 || h > 16){ ok=false; markErr(hrsEl); }
      if(isNaN(a) || a < 0 || a > 100){ ok=false; markErr(attEl); }
      if(isNaN(m) || m < 0 || m > 100){ ok=false; markErr(prevEl); }
      if(!ok){ msgEl.innerText = 'Please correct highlighted fields: hours 0-16, attendance 0-100, marks 0-100.'; return; }
      const payload = { study_hours: h, attendance: a, previous_marks: m };
      try{
        const r = await fetch(`${API}/predict`, {method:'POST', headers:{'Content-Type':'application/json', 'Authorization':`Bearer ${token}`}, body: JSON.stringify(payload)});
        const j = await r.json();
        document.getElementById('out').innerText = JSON.stringify(j, null, 2);
      }catch(e){ msgEl.innerText = 'Network error. Try again.'; }
    }
  </script>
</body>
</html>
